<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HimChayan Mock Tests</title><style>body{font-family:system-ui,Arial;background:#f3f7fc;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#1169bd,#08a66e);color:#fff;padding:22px;border-radius:18px}.modes{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.mode{padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #d9e3ee;text-decoration:none;font-weight:900;color:#173968}.mode.active{background:#1266d6;color:#fff}.back{display:inline-block;background:#e4edf8;color:#173968;text-decoration:none;padding:10px 13px;border-radius:10px;font-weight:900;margin:0 0 12px}.exam-wrap{background:#fff;border:1px solid #d9e3ee;border-radius:15px;padding:14px;margin:14px 0}.exam-select{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.exam-select select{flex:1;min-width:160px;padding:12px;border:1px solid #cfd9e5;border-radius:9px;background:#f4f7fb;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid #e1e8f1;border-radius:14px;padding:16px}.btn{display:inline-block;background:#1266d6;color:#fff;text-decoration:none;padding:9px 12px;border-radius:8px;font-weight:800;font-size:11px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e9faf3;color:#087d5d;font-size:10px;font-weight:900}.paid{background:#fff3d8;color:#946500}.muted{color:#718096;font-size:11px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="back" href="index.html">← Back to Home</a><section class="hero"><h1>📝 Mock Tests</h1><p>Subject Mock और Competitive Exam Mock — CBT / TBT.</p></section><section class="exam-wrap" id="cbtExamBox" hidden><h2>Choose Exam</h2><p class="muted">Select an exam to open its PDF / Notes resources.</p><div class="exam-select"><select id="cbtExamSelect"><option value="">Select Exam</option></select><button class="btn" id="cbtOpenPdf" type="button">📄 PDF</button><button class="btn" style="background:#07865f" id="cbtOpenNotes" type="button">📝 Notes</button></div></section><div class="modes"><a class="mode" id="cbt" href="mock-tests.html?template=CBT">💻 CBT Mode</a><a class="mode" id="tbt" href="mock-tests.html?template=TBT">📝 TBT / OMR Mode</a></div><div id="status" class="muted">Published mocks load हो रहे हैं…</div><section id="grid" class="grid" style="margin-top:10px"></section></main><script>const API='https://himchayan-learning-api.pmindia.workers.dev';const p=new URLSearchParams(location.search),template=(p.get('template')||'').toUpperCase();document.getElementById(template==='CBT'?'cbt':'tbt').classList.toggle('active',!!template);const grid=document.getElementById('grid'),status=document.getElementById('status');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const EXAMS=[['JBT','JBT'],['TGT Arts','TGT Arts'],['TGT Medical','TGT Medical'],['TGT Non-Medical','TGT Non-Medical'],['TGT Special Educator','TGT Special Educator'],['LT','LT'],['CTET','CTET'],['HP TET','HP TET'],['PGT','PGT'],['NET','NET'],['SET','SET'],['HAS','HAS'],['Naib Tehsildar','NT'],['Allied','Allied'],['High Court','High Court'],['JOA','JOA'],['Patwari','Patwari'],['Staff Nurse','Staff Nurse'],['HP Police','Police'],['Forest Guard','Forest Guard'],['Secretariat Clerk','Secretariat Clerk'],['Panchayat Secretary','Panchayat Secretary'],['Banking','All Banking Exam'],['SSC MTS','SSC MTS'],['SSC','SSC OTHER'],['SSC GD','SSC GD'],['Railway','RAILWAY'],['Other Exam','Other']];
function renderCbtExamResources(){
 const box=document.getElementById('cbtExamBox'),select=document.getElementById('cbtExamSelect');
 box.hidden=false;
 select.innerHTML='<option value="">Select Exam</option>'+EXAMS.map(([label,group])=>'<option value="'+esc(group)+'">'+esc(label)+'</option>').join('');
 status.textContent='Choose an exam and select PDF or Notes.';
 grid.innerHTML='';
 function openType(type){const group=select.value;if(!group){status.textContent='Please select an exam first.';return;}location.href='all-exam.html?exam_group='+encodeURIComponent(group)+'&content_type='+encodeURIComponent(type);}
 document.getElementById('cbtOpenPdf').onclick=()=>openType('PDF');
 document.getElementById('cbtOpenNotes').onclick=()=>openType('NOTES');
}
function renderCbtExamResources(){status.textContent='Select an exam, then open its available PDF or Notes resources.';grid.innerHTML=EXAMS.map(([label,group])=>'<article class="card"><h2>'+esc(label)+'</h2><p class="muted">Exam-wise study resources</p><p style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><a class="btn" href="all-exam.html?exam_group='+encodeURIComponent(group)+'&content_type=PDF">📄 PDF</a><a class="btn" style="background:#07865f" href="all-exam.html?exam_group='+encodeURIComponent(group)+'&content_type=NOTES">📝 Notes</a></p></article>').join('');}async function load(){if(template==='CBT'){renderCbtExamResources();return;}try{const r=await fetch(API+'/api/mocks'+(template?'?template='+encodeURIComponent(template):''),{cache:'no-store'});const d=await r.json();const rows=Array.isArray(d.data)?d.data:[];status.textContent=rows.length+' published mock(s)'+(template?' · '+template:'');grid.innerHTML=rows.map(x=>{const paid=String(x.access_type||'FREE').toUpperCase()!=='FREE';return '<article class="card"><span class="pill '+(paid?'paid':'')+'">'+esc(x.access_type||'FREE')+'</span><h2>'+esc(x.title||'Mock Test')+'</h2><p class="muted">'+esc(x.exam_name||'')+(x.subject_name?' · '+esc(x.subject_name):'')+'</p><p class="muted">'+esc(x.total_questions||0)+' Questions · '+esc(x.timer_minutes||0)+' min · Negative '+esc(x.negative_marking||0)+'</p><a class="btn" href="mock-tests.html?mock='+encodeURIComponent(x.id||'')+'">Open Mock</a></article>'}).join('')||'<div class="card">No published '+(template||'')+' mocks yet. Admin से publish करने पर यहाँ automatically दिखाई देंगे.</div>';}catch(e){status.textContent='Learning Engine connect नहीं हो पाया।';}}</script></body></html>
