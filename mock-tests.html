<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HimChayan Mock Tests</title><style>body{font-family:system-ui,Arial;background:#f3f7fc;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#1169bd,#08a66e);color:#fff;padding:22px;border-radius:18px}.modes{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.mode{padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #d9e3ee;text-decoration:none;font-weight:900;color:#173968}.mode.active{background:#1266d6;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid #e1e8f1;border-radius:14px;padding:16px}.btn{display:inline-block;background:#1266d6;color:#fff;text-decoration:none;padding:9px 12px;border-radius:8px;font-weight:800;font-size:11px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e9faf3;color:#087d5d;font-size:10px;font-weight:900}.paid{background:#fff3d8;color:#946500}.muted{color:#718096;font-size:11px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>📝 Mock Tests</h1><p>Subject Mock और Competitive Exam Mock — CBT / TBT.</p></section><div class="modes"><a class="mode" id="cbt" href="mock-tests.html?template=CBT">💻 CBT Mode</a><a class="mode" id="tbt" href="mock-tests.html?template=TBT">📝 TBT / OMR Mode</a></div><div id="status" class="muted">Published mocks load हो रहे हैं…</div><section id="grid" class="grid" style="margin-top:10px"></section></main><script>const API='https://himchayan-learning-api.pmindia.workers.dev';const p=new URLSearchParams(location.search),template=(p.get('template')||'').toUpperCase();document.getElementById(template==='CBT'?'cbt':'tbt').classList.toggle('active',!!template);const grid=document.getElementById('grid'),status=document.getElementById('status');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){try{const r=await fetch(API+'/api/mocks'+(template?'?template='+encodeURIComponent(template):''),{cache:'no-store'});const d=await r.json();const rows=Array.isArray(d.data)?d.data:[];status.textContent=rows.length+' published mock(s)'+(template?' · '+template:'');grid.innerHTML=rows.map(x=>{const paid=String(x.access_type||'FREE').toUpperCase()!=='FREE';return '<article class="card"><span class="pill '+(paid?'paid':'')+'">'+esc(x.access_type||'FREE')+'</span><h2>'+esc(x.title||'Mock Test')+'</h2><p class="muted">'+esc(x.exam_name||'')+(x.subject_name?' · '+esc(x.subject_name):'')+'</p><p class="muted">'+esc(x.total_questions||0)+' Questions · '+esc(x.timer_minutes||0)+' min · Negative '+esc(x.negative_marking||0)+'</p><a class="btn" href="mock-tests.html?mock='+encodeURIComponent(x.id||'')+'">Open Mock</a></article>'}).join('')||'<div class="card">No published '+(template||'')+' mocks yet. Admin से publish करने पर यहाँ automatically दिखाई देंगे.</div>';}catch(e){status.textContent='Learning Engine connect नहीं हो पाया।';}}load();</script></body></html>
