<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HimChayan Quiz</title><style>body{font-family:system-ui,Arial;background:#f3f7fc;margin:0;color:#172033}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e1e8f1;border-radius:15px;padding:18px;margin-top:12px}.option{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;background:#fff;border:1px solid #d9e2ec;border-radius:9px}.pill{font-size:10px;font-weight:900;background:#e9faf3;color:#087d5d;padding:4px 8px;border-radius:99px}.muted{color:#718096;font-size:11px}</style></head><body><main class="wrap"><div class="card"><h1>🧠 HimChayan Quiz</h1><p class="muted">Published quizzes central Learning Engine से load होते हैं.</p></div><div id="root"></div></main><script>const API='https://himchayan-learning-api.pmindia.workers.dev',root=document.getElementById('root'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){try{const r=await fetch(API+'/api/quizzes',{cache:'no-store'}),d=await r.json(),rows=Array.isArray(d.data)?d.data:[];root.innerHTML=rows.map(x=>'<section class="card"><span class="pill">'+esc(x.access_type||'FREE')+'</span><h2>'+esc(x.title||'Quiz')+'</h2><p class="muted">'+esc(x.description||'')+'</p><p>Quiz is ready from the central question bank.</p></section>').join('')||'<div class="card">No published quiz yet.</div>'}catch(e){root.innerHTML='<div class="card">Learning Engine connect नहीं हो पाया।</div>'}}load();</script></body></html>
