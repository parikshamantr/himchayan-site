<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HimChayan Study Notes</title><style>*{box-sizing:border-box}body{font-family:system-ui,Arial;background:#f3f7fc;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;margin-bottom:14px}.back{border:0;background:#e5eef8;padding:10px 13px;border-radius:10px;font-weight:800}.hero{background:linear-gradient(135deg,#087dce,#05a66d);color:white;padding:22px;border-radius:18px}.hero h1{margin:0 0 6px}.toolbar{background:white;border:1px solid #dfe7f0;border-radius:14px;padding:12px;margin:14px 0;display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:12px;border:1px solid #cfd9e5;border-radius:9px;flex:1;min-width:150px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #e1e8f1;border-radius:14px;padding:15px}.card h3{margin:8px 0}.muted{color:#718096;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;background:#1266d6;color:white;padding:10px 12px;border-radius:9px;font-weight:800;font-size:12px}.notes{background:#079b70}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#e8f8ef;color:#13834d;font-size:10px;font-weight:900}.group{margin:18px 0}.group h2{font-size:18px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="location.href='index.html'">← Back to Home</button><span class="muted">HimChayan Learning</span></div><section class="hero"><h1>📚 Study Notes</h1><p>Subject-wise PDF और Notes — content category चुनें।</p></section><div class="toolbar"><input id="q" placeholder="Search exam / subject..."><select id="exam"><option value="" selected disabled>Select Exam</option></select><select id="subject"><option value="">All Subjects</option></select></div><div id="status" class="muted"></div><section id="grid"></section></main><script>const EXAMS=["JBT","TGT","JOA","Panchayat Secretary","Secretariat Clerk","HP Police","Forest","Patwari","High Court","Staff Nurse","HP TET","CTET","HAS","SSC","SSC GD","CGL","PGT","Railway","Banking","Allied","Naib Tehsildar","Other Exam"];const SUBJECTS=["Hindi","English","Mathematics","General Science","General Knowledge","Current Affairs","Computer","Reasoning","Polity","Economics","Geography","History","Sociology","HP GK","Miscellaneous","Political Science"];const PGT=["Hindi","English","History","Political Science","Geography","Economics"];const exam=document.getElementById("exam"),subject=document.getElementById("subject"),q=document.getElementById("q");exam.innerHTML+='<option>PGT</option>'+EXAMS.filter(x=>x!=="PGT").map(x=>'<option>'+x+'</option>').join("");subject.innerHTML+=SUBJECTS.map(x=>'<option>'+x+'</option>').join("")+'<option>Political Science</option>';function pending(s,t){alert(s+" — "+t+"\nयहाँ file/link Admin द्वारा जोड़ा जाएगा। वास्तविक upload R2 setup के बाद जोड़ा जाएगा।")}function render(){const e=exam.value,s=subject.value,t=q.value.trim().toLowerCase(),list=e==="PGT"?PGT:SUBJECTS;const a=list.filter(x=>(!s||s===x)&&(!t||(x+" "+e).toLowerCase().includes(t)));document.getElementById("status").textContent=a.length+" subjects · "+(e||"All Exams");document.getElementById("grid").innerHTML='<section class="group"><h2>📘 '+(e||"All Exams")+' — Subjects</h2><div class="grid">'+a.map(x=>'<article class="card"><span class="tag">SUBJECT</span><h3>'+x+'</h3><div class="muted">इस subject के लिए content type चुनें</div><div class="actions"><button class="btn" data-sub="'+x+'" data-type="PDF">📄 PDF</button><button class="btn notes" data-sub="'+x+'" data-type="Notes">📝 Notes</button></div></article>').join("")+'</div></section>';document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>pending(b.dataset.sub,b.dataset.type))}exam.onchange=render;subject.onchange=render;q.oninput=render;render();</script></body></html>
