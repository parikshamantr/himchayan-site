<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HimChayan Study Notes</title><style>body{font-family:system-ui,Arial;background:#f3f7fc;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#087dce,#05a66d);color:#fff;padding:22px;border-radius:18px}.hero h1{margin:0 0 5px}.toolbar{background:#fff;border:1px solid #dfe7f0;border-radius:14px;padding:12px;margin:14px 0;display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px;border:1px solid #cfd9e5;border-radius:9px;flex:1;min-width:150px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid #e1e8f1;border-radius:14px;padding:16px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e9faf3;color:#087d5d;font-size:10px;font-weight:900}.paid{background:#fff3d8;color:#946500}.btn{display:inline-block;background:#1266d6;color:#fff;text-decoration:none;padding:9px 11px;border-radius:8px;font-weight:800;font-size:11px;margin:4px 4px 0 0}.muted{color:#718096;font-size:11px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>📚 Study Notes</h1><p>Free Notes — PDF और Notes subject-wise.</p></section><div class="toolbar"><input id="q" placeholder="Search exam / subject / notes..."><select id="subject"><option value="">All Subjects</option></select></div><div id="status" class="muted">Learning Engine से content load हो रहा है…</div><section id="grid" class="grid" style="margin-top:10px"></section></main><script>const API='https://himchayan-learning-api.pmindia.workers.dev';const grid=document.getElementById('grid'),status=document.getElementById('status'),q=document.getElementById('q'),subject=document.getElementById('subject');let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){try{const r=await fetch(API+'/api/study-notes',{cache:'no-store'});const d=await r.json();rows=Array.isArray(d.data)?d.data:[];const subs=[...new Set(rows.map(x=>x.subject_name||x.subject||'').filter(Boolean))];subject.innerHTML='<option value="">All Subjects</option>'+subs.map(x=>'<option>'+esc(x)+'</option>').join('');render();}catch(e){status.textContent='Learning Engine connect नहीं हो पाया।';}}function render(){const term=q.value.trim().toLowerCase(),sub=subject.value;const a=rows.filter(x=>(!term||JSON.stringify(x).toLowerCase().includes(term))&&(!sub||(x.subject_name||x.subject||'')===sub));status.textContent=a.length+' published notes/resources';grid.innerHTML=a.map(x=>{const paid=String(x.access_type||'FREE').toUpperCase()!=='FREE';const href=x.external_url||'#';return '<article class="card"><span class="pill '+(paid?'paid':'')+'">'+esc(x.access_type||'FREE')+'</span><h3>'+esc(x.title||'Study Note')+'</h3><p class="muted">'+esc(x.exam_name||'')+(x.description?' · '+esc(x.description):'')+'</p>'+ (href!=='#'?'<a class="btn" href="'+esc(href)+'" target="_blank">📄 Open PDF/Notes</a>':'<span class="muted">Viewer link will be added by Admin.</span>')+'</article>'}).join('')||'<div class="card">No published Study Notes yet.</div>';}q.addEventListener('input',render);subject.addEventListener('change',render);load();</script></body></html>
