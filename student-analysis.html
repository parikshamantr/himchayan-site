<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HimChayan Student Analysis</title><style>body{font-family:system-ui,Arial;background:#f3f7fc;color:#172033;margin:0}.wrap{max-width:1000px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e1e8f1;border-radius:14px;padding:18px}.card strong{font-size:24px;display:block;margin-top:5px}.muted{color:#718096;font-size:11px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><h1>📈 My Performance</h1><p class="muted" id="status">Learning Engine analysis load हो रहा है…</p><div class="grid"><div class="card">Tests<strong id="tests">0</strong></div><div class="card">Average Score<strong id="avg">0%</strong></div><div class="card">Accuracy<strong id="acc">0%</strong></div><div class="card">Best Score<strong id="best">0%</strong></div></div></main><script>const API='https://himchayan-learning-api.pmindia.workers.dev';let token='';try{const s=JSON.parse(localStorage.getItem('himchayan_auth_session')||'{}');token=s.access_token||s.session?.access_token||''}catch(e){}fetch(API+'/api/performance/me',{headers:token?{Authorization:'Bearer '+token}:{}}).then(r=>r.json()).then(d=>{const p=d.data||{};document.getElementById('tests').textContent=p.total_tests||0;document.getElementById('avg').textContent=Math.round(p.average_score||0)+'%';document.getElementById('acc').textContent=Math.round(p.latest_accuracy||0)+'%';document.getElementById('best').textContent=Math.round(p.best_score||0)+'%';document.getElementById('status').textContent='Your Learning Engine performance';}).catch(()=>document.getElementById('status').textContent='Login करके अपना personal performance देखें।');</script></body></html>
